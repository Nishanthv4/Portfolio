<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#080e18"/>
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="aiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#aiBg)"/>

  <!-- Matrix/Grid lines -->
  <g stroke="#1b2a3d" stroke-width="1" opacity="0.5">
    <line x1="50" y1="0" x2="50" y2="380"/>
    <line x1="280" y1="0" x2="280" y2="380"/>
    <line x1="550" y1="0" x2="550" y2="380"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
  </g>

  <!-- Main App Shell -->
  <rect x="25" y="25" width="550" height="330" rx="12" fill="#0f1826" stroke="#25384d" stroke-width="1.5" filter="url(#aiShadow)"/>
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="550" height="42" rx="12" fill="#142133"/>
  <path d="M 25 55 L 25 67 L 575 67 L 575 55 Z" fill="#142133"/>
  <circle cx="45" cy="46" r="4.5" fill="#ef4444"/>
  <circle cx="60" cy="46" r="4.5" fill="#f59e0b"/>
  <circle cx="75" cy="46" r="4.5" fill="#10b981"/>
  <text x="100" y="50" font-family="'Fira Code', monospace" font-size="12" fill="#8aa2be" font-weight="500">ai-news-detector // credibility-analyzer.py</text>
  
  <!-- Badge -->
  <rect x="445" y="38" width="115" height="18" rx="9" fill="url(#geminiGrad)" opacity="0.25"/>
  <text x="502" y="51" font-family="'Fira Code', monospace" font-size="9" fill="#93c5fd" text-anchor="middle" font-weight="600">✦ GEMINI ASSISTED</text>

  <!-- Left Column: Input Claim & Heuristic Signals -->
  <rect x="40" y="80" width="250" height="150" rx="8" fill="#111c2b" stroke="#1d2e42" stroke-width="1"/>
  <text x="52" y="100" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8" font-weight="600">ANALYZED ARTICLE / CLAIM</text>
  
  <!-- Snippet text box -->
  <rect x="52" y="110" width="226" height="50" rx="6" fill="#0a121d"/>
  <text x="62" y="128" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">"Breakthrough battery tech powers cars</text>
  <text x="62" y="144" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">for 10,000 miles without charging..."</text>

  <!-- Extraction indicators -->
  <text x="52" y="180" font-family="'Fira Code', monospace" font-size="9" fill="#64748b">Detected Tone: Sensationalized (+0.42)</text>
  <text x="52" y="196" font-family="'Fira Code', monospace" font-size="9" fill="#64748b">Source Citations: 0 Primary links</text>
  <text x="52" y="212" font-family="'Fira Code', monospace" font-size="9" fill="#38bdf8">Cross-Verification: 3 Trusted debunks found</text>

  <!-- Right Column: Credibility Score & Breakdown -->
  <rect x="305" y="80" width="250" height="150" rx="8" fill="#111d2d" stroke="#1f344a" stroke-width="1"/>
  <text x="320" y="100" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8" font-weight="600">CREDIBILITY ASSESSMENT</text>
  
  <!-- Gauge Arc or Progress bar -->
  <rect x="320" y="115" width="220" height="8" rx="4" fill="#1a2b3c"/>
  <rect x="320" y="115" width="70" height="8" rx="4" fill="#f59e0b"/>
  <text x="320" y="142" font-family="'Fira Code', monospace" font-size="20" fill="#f59e0b" font-weight="700">32%</text>
  <text x="375" y="140" font-family="'Inter', sans-serif" font-size="11" fill="#fcd34d" font-weight="600">Low Reliability Context</text>

  <text x="320" y="165" font-family="'Inter', sans-serif" font-size="9.5" fill="#94a3b8">Key Factors Identified:</text>
  <text x="320" y="182" font-family="'Inter', sans-serif" font-size="9" fill="#e2e8f0">• Extraordinary claims lacking peer-reviewed proof</text>
  <text x="320" y="198" font-family="'Inter', sans-serif" font-size="9" fill="#e2e8f0">• Clickbait headline formula with vague attribution</text>
  <text x="320" y="214" font-family="'Inter', sans-serif" font-size="9" fill="#e2e8f0">• Similar patterns tracked in synthetic click farms</text>

  <!-- Bottom Full Row: AI-Generated Nuance & Explanation -->
  <rect x="40" y="242" width="515" height="98" rx="8" fill="#122031" stroke="#233a52" stroke-width="1"/>
  <rect x="52" y="254" width="20" height="20" rx="10" fill="#38bdf8" opacity="0.2"/>
  <text x="59" y="268" font-family="'Fira Code', monospace" font-size="11" fill="#38bdf8">✦</text>
  <text x="80" y="268" font-family="'Inter', sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">AI Contextual Breakdown & Nuance</text>
  <text x="52" y="292" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">"While solid-state and silicon-anode battery research is making genuine progress, this headline</text>
  <text x="52" y="307" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">dramatically inflates lab bench prototypes into commercial reality without verifiable lab citations."</text>
  <text x="52" y="327" font-family="'Fira Code', monospace" font-size="8.5" fill="#64748b">Disclaimer: Educational heuristic analysis. Always corroborate with primary investigative journals.</text>
</svg>
