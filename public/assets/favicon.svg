<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1219"/>
      <stop offset="100%" stop-color="#050a0e"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect x="8" y="8" width="48" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Terminal top bar dots -->
  <circle cx="15" cy="15" r="2" fill="#ef4444"/>
  <circle cx="21" cy="15" r="2" fill="#f59e0b"/>
  <circle cx="27" cy="15" r="2" fill="#10b981"/>
  <!-- Code Symbol N & prompt -->
  <path d="M16 42 L24 34 L16 26" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="32" y="42" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="url(#primaryGrad)">N</text>
  <line x1="48" y1="42" x2="52" y2="42" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
