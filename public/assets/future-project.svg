<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="fpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1622"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="blueprintGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#172738" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#fpBg)"/>
  <rect width="600" height="380" fill="url(#blueprintGrid)"/>

  <!-- Blueprint Wireframe Box -->
  <rect x="35" y="35" width="530" height="310" rx="10" fill="#0d1926" stroke="#253c52" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Crosshairs -->
  <line x1="300" y1="20" x2="300" y2="360" stroke="#1e3447" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="20" y1="190" x2="580" y2="190" stroke="#1e3447" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Blueprint Icon / Node -->
  <circle cx="300" cy="140" r="42" fill="#112233" stroke="url(#cyanLine)" stroke-width="2"/>
  <circle cx="300" cy="140" r="54" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Hammer / Terminal / Rocket Symbol in center -->
  <path d="M 288 140 L 312 140 M 300 128 L 300 152" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Text -->
  <text x="300" y="222" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Next Practical Project</text>
  <text x="300" y="246" font-family="'Fira Code', monospace" font-size="11" fill="#38bdf8" text-anchor="middle">STATUS: IN_IDEATION // ARCHITECTURE PHASE</text>
  <text x="300" y="274" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Strengthening core CS fundamentals · Cloud &amp; Web experimentation</text>

  <!-- Technical specs / dimensions label -->
  <rect x="55" y="55" width="110" height="22" rx="4" fill="#132333" stroke="#243d54" stroke-width="1"/>
  <text x="110" y="70" font-family="'Fira Code', monospace" font-size="9" fill="#64748b" text-anchor="middle">SLOT: 03_FUTURE</text>
  
  <rect x="435" y="55" width="110" height="22" rx="4" fill="#132333" stroke="#243d54" stroke-width="1"/>
  <text x="490" y="70" font-family="'Fira Code', monospace" font-size="9" fill="#10b981" text-anchor="middle">READY_TO_BUILD</text>
</svg>
